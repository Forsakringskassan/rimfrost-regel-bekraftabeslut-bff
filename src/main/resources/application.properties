# Port - matches old TypeScript BFF default
quarkus.http.port=9003

# Bekraftabeslut backend URL (replaces BE_BEKRAFTABESLUT_URL in .env)
quarkus.rest-client.bekraftabeslut.url=${BE_BEKRAFTABESLUT_URL:http://localhost:8891}

# CORS - allow the frontend to call this BFF
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3030}
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Container image
quarkus.container-image.build=false
quarkus.container-image.name=rimfrost-regel-bekraftabeslut-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false
